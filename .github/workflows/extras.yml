name: Extras
on:
  push:
    tags:
    - 'Txextras_v*' # TxExtras, the three ECUs' stock bins for TxSuite, e.g. Txextras_v1.0.0

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # the stock bins on their own track, as upstream's T7Extras / T8Extras: they hardly change, TxSuite's packages leave them out
  extras:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # the tags, for the notes of releases/latest

    # TxExtrasSetup.exe installs into TxSuite's folder, Binaries\T5, T7 and T8 (SetupTx/TxExtras.iss)
    - name: Build setup
      shell: pwsh
      run: |
        $v = $env:GITHUB_REF_NAME -replace '^.*_v', '' -replace '-.*$', ''
        choco install innosetup -y --no-progress | Out-Null
        $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
        & $iscc /Q "/DVersion=$v" "/O$env:GITHUB_WORKSPACE\dist" SetupTx\TxExtras.iss
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    # TxExtras.zip: the Binaries folder to unpack into TxSuite's folder (Linux, macOS), Binaries/<ECU> as the setup lays it out
    - name: Zip
      run: |
        for e in T5 T7 T8; do mkdir -p dist/Binaries/$e && cp ${e}Binaries/* dist/Binaries/$e/; done
        cd dist && 7z a TxExtras.zip Binaries > /dev/null && rm -r Binaries

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: "false"
        files: dist/*

    - name: Latest release
      if: ${{ !contains(github.ref_name, '-') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash packaging/latest-release.sh dist/*
