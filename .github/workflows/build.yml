name: Build
on:
  push:
    branches: [master]
    tags:
    - 'T7suite_v*' # a T7Suite release, e.g. T7suite_v2.0.0
    - 'T8suite_v*' # a T8Suite release, e.g. T8suite_v2.0.0; T5suite_v* tags belong to T5Suite
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # history and tags, each suite's version comes from its nearest <Suite>_v* tag (Directory.Build.props)

    # TrionicCANLib from the Trionic submodule; only that one, T7Suite/CommonSuite's git:// url no longer resolves
    - name: Trionic submodule
      run: git submodule update --init Trionic

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # no -r: a solution can't be built for one RID, T7App and T8App pick x86 on Windows by themselves
    - name: Build
      run: dotnet build TuningSuites.slnx -c Release

    # the code the suites share: settings, crypto, S19, transaction log, update check, source encoding
    - name: Test shared core
      run: dotnet test SuiteCoreTest -c Release --no-build

    # golden parse of every bin in T7Binaries and the T7 logic
    - name: Test
      run: dotnet test T7CoreTest -c Release --no-build

    # golden parse of every bin in T5Binaries and the T5 logic
    - name: Test T5
      run: dotnet test T5CoreTest -c Release --no-build

    # golden parse of every bin in T8Binaries and the T8 logic
    - name: Test T8
      run: dotnet test T8CoreTest -c Release --no-build

    # map controls: model and ops, keyboard/mouse and Skia renders in a headless window
    - name: Test map controls
      run: dotnet test MapControlsTest -c Release --no-build

    # the app headless on a stock bin: open, symbol list, map viewer, firmware information
    - name: Test app
      run: dotnet test T7AppTest -c Release --no-build

    # T8Suite on the shared window, headless on a stock bin
    - name: Test T8 app
      run: dotnet test T8AppTest -c Release --no-build

    # T5Suite on the shared window, headless on a stock bin: open, firmware options, tuning wizards
    - name: Test T5 app
      run: dotnet test T5AppTest -c Release --no-build

  # each suite for each platform, packaged as roffe/Trionic packages the flasher: <suite>App, Setup<suite>, out/<suite>Suite
  package:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        # a suite's tag packages that suite, anything else both
        suite: ${{ fromJSON(startsWith(github.ref, 'refs/tags/T7suite_v') && '["T7"]' || startsWith(github.ref, 'refs/tags/T8suite_v') && '["T8"]' || '["T7","T8"]') }}
        rid: [win-x86, linux-x64, linux-arm64, osx-arm64, osx-x64]
        include:
        - { rid: win-x86,     os: windows-latest }
        - { rid: linux-x64,   os: ubuntu-latest }
        - { rid: linux-arm64, os: ubuntu-latest }
        - { rid: osx-arm64,   os: macos-latest }
        - { rid: osx-x64,     os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ matrix.suite }}App
      SUITE: ${{ matrix.suite }}Suite
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Trionic submodule
      run: git submodule update --init Trionic

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # also puts the stock bins in Binaries (T7App.csproj, T8App.csproj)
    - name: Publish
      run: dotnet publish $APP/$APP.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out/$SUITE

    # LibUsbDotNet needs native libusb-1.0 for the CombiAdapter, its NuGet ships none.
    # ponytail: MinGW32 build because it only links msvcrt.dll, the VS builds need the VC++ 2015+ runtime
    - name: Add libusb-1.0.dll
      if: runner.os == 'Windows'
      run: |
        curl -fsSLo libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
        echo "7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79  libusb.7z" | sha256sum -c
        7z x -y -olibusb libusb.7z > /dev/null
        cp libusb/MinGW32/dll/libusb-1.0.dll out/$SUITE/

    # T7Suite.msi / T8Suite.msi, and zipped as upstream's releases had it (T7Suite.zip)
    - name: Build Setup
      if: runner.os == 'Windows'
      run: |
        dotnet build Setup${{ matrix.suite }}/Setup${{ matrix.suite }}.wixproj -c Release -p:Platform=x86 "-p:PublishDir=$GITHUB_WORKSPACE/out/$SUITE"
        mkdir dist
        cp Setup${{ matrix.suite }}/bin/x86/Release/$SUITE.msi dist/
        cd dist && 7z a $SUITE.zip $SUITE.msi

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        cp packaging/linux/$SUITE/* out/$SUITE/
        mkdir dist
        tar -czf dist/$SUITE-${{ matrix.rid }}.tar.gz -C out $SUITE

    # ponytail: plain unsigned folder, no .app bundle or notarization (and so no .bin association)
    - name: Package macOS
      if: runner.os == 'macOS'
      run: |
        mkdir dist
        ditto -c -k --keepParent out/$SUITE dist/$SUITE-${{ matrix.rid }}.zip

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.suite }}Suite-${{ matrix.rid }}
        path: dist/*
        if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: actions/setup-dotnet@v6
      if: github.ref == 'refs/heads/master'
      with:
        dotnet-version: 10.x

    # the same VersionFromGit target the build ran, e.g. 2.0.0-bfecafebc, per suite
    - name: Version
      id: version
      if: github.ref == 'refs/heads/master'
      env:
        DOTNET_NOLOGO: true
      run: |
        echo "t7=$(dotnet msbuild T7App/T7App.csproj -t:VersionFromGit -getProperty:InformationalVersion)" >> "$GITHUB_OUTPUT"
        echo "t8=$(dotnet msbuild T8App/T8App.csproj -t:VersionFromGit -getProperty:InformationalVersion)" >> "$GITHUB_OUTPUT"

    # ponytail: rolling tags, one pre-release per suite that always points at the latest master build; the update check skips them
    - name: Move nightly tags
      if: github.ref == 'refs/heads/master'
      run: |
        git tag -f T7suite_nightly
        git tag -f T8suite_nightly
        git push -f origin T7suite_nightly T8suite_nightly

    - name: T7Suite nightly release
      if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: T7suite_nightly
        name: T7Suite nightly build ${{ steps.version.outputs.t7 }}
        body: Automated build ${{ steps.version.outputs.t7 }} of ${{ github.sha }}
        prerelease: true
        make_latest: "false"
        files: dist/T7Suite*

    - name: T8Suite nightly release
      if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: T8suite_nightly
        name: T8Suite nightly build ${{ steps.version.outputs.t8 }}
        body: Automated build ${{ steps.version.outputs.t8 }} of ${{ github.sha }}
        prerelease: true
        make_latest: "false"
        files: dist/T8Suite*

    # the update check finds it by its <suite>_v tag, not by GitHub's latest marker (that's whichever suite released last);
    # only the tagged suite was packaged
    - name: Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: "true"
        files: dist/*
