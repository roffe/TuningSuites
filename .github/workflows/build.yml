name: Build
on:
  push:
    branches: [net10]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: TuningSuites
        fetch-depth: 0 # history and tags, each suite's version comes from its nearest <suite>/v* tag (Directory.Build.props)

    # TrionicCANLib from the Trionic submodule; only that one, T7Suite/CommonSuite's git:// url no longer resolves
    - name: Trionic submodule
      run: git -C TuningSuites submodule update --init Trionic

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # no -r: a solution can't be built for one RID, T7App picks x86 on Windows by itself
    - name: Build
      run: dotnet build TuningSuites/TuningSuites.slnx -c Release

    # golden parse of every bin in T7Binaries, settings, crypto, S19, transaction log
    - name: Test
      run: dotnet test TuningSuites/T7CoreTest -c Release --no-build

    # map controls: model and ops, keyboard/mouse and Skia renders in a headless window
    - name: Test map controls
      run: dotnet test TuningSuites/MapControlsTest -c Release --no-build

    # the app headless on a stock bin: open, symbol list, map viewer, firmware information
    - name: Test app
      run: dotnet test TuningSuites/T7AppTest -c Release --no-build
