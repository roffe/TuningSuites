name: Build
on:
  push:
    branches: [master]
    tags:
    - 'Txsuite_v*' # a TxSuite release, e.g. Txsuite_v1.0.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # history and tags, the version comes from the nearest Txsuite_v* tag (Directory.Build.props)

    # TrionicCANLib from the Trionic submodule; only that one, the old OldSuites/T7Suite/CommonSuite's git:// url no longer resolves
    - name: Trionic submodule
      run: git submodule update --init Trionic

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # no -r: a solution can't be built for one RID, the apps pick x86 on Windows by themselves
    - name: Build
      run: dotnet build TuningSuites.slnx -c Release

    # the code the suites share: settings, crypto, S19, transaction log, update check, source encoding
    - name: Test shared core
      run: dotnet test SuiteCoreTest -c Release --no-build

    # golden parse of every bin in T7Binaries and the T7 logic
    - name: Test T7
      run: dotnet test T7CoreTest -c Release --no-build

    # golden parse of every bin in T5Binaries and the T5 logic
    - name: Test T5
      run: dotnet test T5CoreTest -c Release --no-build

    # golden parse of every bin in T8Binaries and the T8 logic
    - name: Test T8
      run: dotnet test T8CoreTest -c Release --no-build

    # map controls: model and ops, keyboard/mouse and Skia renders in a headless window
    - name: Test map controls
      run: dotnet test MapControlsTest -c Release --no-build

    # TxSuite headless on a T7 stock bin: open, symbol list, map viewer, firmware information
    - name: Test T7 app
      run: dotnet test T7AppTest -c Release --no-build

    # TxSuite headless on a T8 stock bin
    - name: Test T8 app
      run: dotnet test T8AppTest -c Release --no-build

    # TxSuite headless on a T5 stock bin: open, firmware options, tuning wizards
    - name: Test T5 app
      run: dotnet test T5AppTest -c Release --no-build

    # TxSuite headless: switching ECUs, the partnumber lookup over every ECU, the settings tabs, the ribbon
    - name: Test TxSuite
      run: dotnet test TxSuiteTest -c Release --no-build

    # the tests open copies of the stock bins: nothing may change in their folders or appear next to them (T7's <bin>.xml, AFR maps)
    - name: Stock bins untouched
      run: |
        left=$(git status --porcelain --ignored -- T5Binaries T7Binaries T8Binaries)
        if [ -n "$left" ]; then echo "::error::the tests changed the stock bin folders"; echo "$left"; exit 1; fi

  # TxSuite for each platform, packaged as roffe/Trionic packages the flasher: publish to out/TxSuite, SetupTx (Inno Setup) on Windows
  package:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        rid: [win-x86, linux-x64, linux-arm64, osx-arm64, osx-x64]
        include:
        - { rid: win-x86,     os: windows-latest }
        - { rid: linux-x64,   os: ubuntu-latest }
        - { rid: linux-arm64, os: ubuntu-latest }
        - { rid: osx-arm64,   os: macos-latest }
        - { rid: osx-x64,     os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Trionic submodule
      run: git submodule update --init Trionic

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # Help's manuals from roffe/TrionicDocumentation's newest release over the repository's copies; GitHub turned the spaces in
    # its asset names into dots
    - name: Newest manuals
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download -R roffe/TrionicDocumentation --pattern '*.pdf' --clobber
        for n in 5 7 8; do mv "Trionic.$n.pdf" "Trionic $n.pdf"; done

    # the stock bins are not in it, they ship as TxExtras (extras.yml)
    - name: Publish
      run: dotnet publish TxSuite/TxSuite.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out/TxSuite

    # LibUsbDotNet needs native libusb-1.0 for the CombiAdapter, its NuGet ships none.
    # ponytail: MinGW32 build because it only links msvcrt.dll, the VS builds need the VC++ 2015+ runtime
    - name: Add libusb-1.0.dll
      if: runner.os == 'Windows'
      run: |
        curl -fsSLo libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
        echo "7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79  libusb.7z" | sha256sum -c
        7z x -y -olibusb libusb.7z > /dev/null
        cp libusb/MinGW32/dll/libusb-1.0.dll out/TxSuite/

    # TxSuiteSetup.exe; the runner's Inno Setup if it has one
    - name: Build setup
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress | Out-Null
        $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
        & $iscc /Q "/DPublishDir=$env:GITHUB_WORKSPACE\out\TxSuite" "/O$env:GITHUB_WORKSPACE\dist" SetupTx\TxSuite.iss
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    # TxSuite-win-x86.zip: the same folder to run from anywhere without installing (no .bin association, the update check opens the
    # release page)
    - name: Zip Windows
      if: runner.os == 'Windows'
      run: |
        mkdir -p dist
        cd out && 7z a ../dist/TxSuite-${{ matrix.rid }}.zip TxSuite > /dev/null

    # TxSuite-<rid>.AppImage: the same folder as one file that runs as it is (make appimage builds one locally)
    - name: AppImage
      if: runner.os == 'Linux'
      env:
        PUBLISHED: out/TxSuite
        OUTPUT: dist/TxSuite-${{ matrix.rid }}.AppImage
      run: bash packaging/linux/appimage.sh ${{ matrix.rid }}

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        cp packaging/linux/TxSuite/* out/TxSuite/
        mkdir -p dist
        tar -czf dist/TxSuite-${{ matrix.rid }}.tar.gz -C out TxSuite

    # ponytail: plain unsigned folder, no .app bundle or notarization (and so no .bin association)
    - name: Package macOS
      if: runner.os == 'macOS'
      run: |
        mkdir dist
        ditto -c -k --keepParent out/TxSuite dist/TxSuite-${{ matrix.rid }}.zip

    - uses: actions/upload-artifact@v7
      with:
        name: TxSuite-${{ matrix.rid }}
        path: dist/*
        if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: actions/setup-dotnet@v6
      if: github.ref_type == 'branch'
      with:
        dotnet-version: 10.x

    # the same VersionFromGit target the build ran, e.g. 1.0.0-bfecafebc
    - name: Version
      id: version
      if: github.ref_type == 'branch'
      env:
        DOTNET_NOLOGO: true
      run: echo "tx=$(dotnet msbuild TxSuite/TxSuite.csproj -t:VersionFromGit -getProperty:InformationalVersion)" >> "$GITHUB_OUTPUT"

    # the features, fixes and speedups since the previous Txsuite_v release, from the commit messages
    - name: Release notes
      run: |
        if [ "${{ github.ref_type }}" = branch ]; then printf 'Automated build %s of %s\n\n' "${{ steps.version.outputs.tx }}" "$GITHUB_SHA"; fi > notes.md
        bash packaging/release-notes.sh >> notes.md

    # ponytail: a rolling tag, a pre-release that always points at the latest master build; the update check skips it
    - name: Move nightly tag
      if: github.ref_type == 'branch'
      run: |
        git tag -f Txsuite_nightly
        git push -f origin Txsuite_nightly

    - name: Nightly release
      if: github.ref_type == 'branch'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: Txsuite_nightly
        name: TxSuite nightly build ${{ steps.version.outputs.tx }}
        body_path: notes.md
        prerelease: true
        make_latest: "false"
        files: dist/TxSuite*

    # the update check finds it by its Txsuite_v tag, not by GitHub's latest marker (that's the release below, with TxExtras)
    - name: Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body_path: notes.md
        make_latest: "false"
        files: dist/*

    # releases/latest shows TxSuite's and TxExtras' newest releases on one page, see the script
    - name: Latest release
      if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash packaging/latest-release.sh dist/*
